# Voice & Tone knowledge base configuration.
# Built on Mailchimp's Voice and Tone framework (CC BY-NC 4.0).
# Not affiliated with or endorsed by Mailchimp.
version: 1
kb_version: 0.1.0
profiles:
  default:
    name: "Unnamed"
    primary_locale: en
    locales: [en]
# House rule IDs no speaker may override. Only meaningful once
# /voice-and-tone:speaker add has created a profile; until then leave it out.
# locks: [L20, L21]
# Where brand material comes from - the only place this is configured.
# There is no separate `scan:` key: the `project` entry below IS the scan,
# via its own include/exclude globs. `inbox` is the folder you drop files
# into. Add `local` entries for anything elsewhere on disk and `url` entries
# for pages, with /voice-and-tone:connect.
sources:
  - id: s01
    kind: project
    label: "Project files"
    include:
      - "content/**/*.md"
      - "content/**/*.mdx"
      - "docs/**/*.md"
      - "locales/**/*.json"
      - "locales/**/*.yml"
      - "locales/**/*.po"
      - "README.md"
    exclude:
      - "node_modules/**"
      - "dist/**"
      - "build/**"
      - ".git/**"
      - ".voice-and-tone/**"
  - id: s02
    kind: inbox
    label: "Dropped-in files"
    path: "sources/"
    # Keeps this folder's own instructions out of the corpus. Delete this
    # line if you genuinely want a file named README.md analysed as a source.
    exclude:
      - "README.md"
runtime:
  node: detected
  probed: ~
thresholds:
  corroboration: 2
  derived_min_samples: 5
  stale_months: 9
